[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-health-radar"
version = "0.1.0"
description = "Latent animal disease activity, reporting-gap estimation and short-term risk forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Animal Health Radar contributors" }]
keywords = ["veterinary-epidemiology", "nowcasting", "early-warning", "WAHIS", "HPAI", "ASF"]

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "pyarrow>=14.0",
    "pydantic>=2.5,<3.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "shiny>=1.0,<2.0",
    "shinywidgets>=0.3",
    "plotly>=5.18",
]

[project.optional-dependencies]
explain = ["shap>=0.44"]
ui = ["shinyswatch>=0.7", "faicons>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools]
packages = ["src", "app"]

[tool.setuptools.package-dir]
src = "src"
app = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: marks tests that run part of the modelling pipeline",
    "leakage: point-in-time correctness / temporal leakage guards",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
